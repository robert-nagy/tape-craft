# Generated by `sentinel setup --issue-forms` from the sentinel issue format
# (docs/issue-format.md in the sentinel repository). Re-run it instead of editing by hand.
name: "Bug report"
description: "Steps to reproduce, expected and actual result, and the environment."
labels: ["kind/bug"]
body:
  - type: markdown
    attributes:
      value: "Title: \"<component>: <symptom>\", at most 72 characters, e.g. \"checkout: total ignores discount code\". Leave optional fields empty when there is nothing to say."
  - type: textarea
    id: summary
    attributes:
      label: "Summary"
      description: "One or two sentences: what breaks, and for whom."
      placeholder: "Applying a discount code at checkout does not change the order total."
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: "Steps to reproduce"
      description: "Numbered steps a stranger can repeat from a clean start."
      placeholder: "1. Add any item to the cart.\n2. Open checkout and apply `SPRING10`."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected"
      description: "What should happen, specifically."
      placeholder: "The total drops by 10 % and the discount is listed."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual"
      description: "What happens; error text verbatim, in a code block."
      placeholder: "The total is unchanged; the console shows `TypeError: rate is undefined`."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "Environment"
      description: "Version or commit, OS, runtime, browser, relevant configuration."
      placeholder: "v2.3.1 (commit abc1234), macOS 15, Safari 19."
    validations:
      required: true
  - type: textarea
    id: frequency
    attributes:
      label: "Frequency"
      description: "`always`, `intermittent (n of m tries)` or `once`."
      placeholder: "always"
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: "Impact"
      description: "Who and how many are affected; the workaround, if any."
      placeholder: "Every customer with a code; no workaround."
    validations:
      required: false
  - type: textarea
    id: suspected-cause
    attributes:
      label: "Suspected cause"
      description: "Code pointers found while investigating, marked as a guess."
      placeholder: "Guess: `src/checkout/total.ts:88` reads the rate before the code is applied."
    validations:
      required: false
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "Acceptance criteria"
      description: "At least AC-1, built from the steps and Expected, so the fix gets a regression test."
      placeholder: "- [ ] AC-1: Given a cart with one item, when I apply `SPRING10`, then the total drops by 10 %."
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: "Attachments"
      description: "One bullet per file: the file name, what it shows, and how it was attached (uploaded, inline, pending upload)."
      placeholder: "- `checkout-error.png`: the total after applying `SPRING10` (uploaded)"
    validations:
      required: false
