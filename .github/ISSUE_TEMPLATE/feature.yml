# Generated by `sentinel setup --issue-forms` from the sentinel issue format
# (docs/issue-format.md in the sentinel repository). Re-run it instead of editing by hand.
name: "Feature request"
description: "A problem, a user story and testable acceptance criteria."
labels: ["kind/feature"]
body:
  - type: markdown
    attributes:
      value: "Title: an imperative verb and an object, at most 72 characters, e.g. \"Export invoices as CSV\". Leave optional fields empty when there is nothing to say."
  - type: textarea
    id: problem
    attributes:
      label: "Problem"
      description: "Who is affected, what they cannot do today, and what it costs them."
      placeholder: "Accountants export invoices by copying rows into a spreadsheet, about 40 minutes at each month-end close, and rows get missed."
    validations:
      required: true
  - type: textarea
    id: user-story
    attributes:
      label: "User story"
      description: "One or more \"As a <role>, I want <capability>, so that <benefit>.\""
      placeholder: "As an accountant, I want to export a month of invoices as CSV, so that I can import them into the ledger without retyping."
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "Acceptance criteria"
      description: "A checklist of \"AC-n: Given <state>, when <action>, then <observable result>.\", at least one."
      placeholder: "- [ ] AC-1: Given 120 invoices dated in March, when I export March, then the CSV has 120 rows."
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: "Out of scope"
      description: "Bullets of what this issue will not do."
      placeholder: "- PDF export."
    validations:
      required: false
  - type: textarea
    id: constraints
    attributes:
      label: "Constraints"
      description: "Performance, security, compatibility, data or deadline limits, with numbers and units."
      placeholder: "- An export of 10 000 invoices finishes in under 5 s."
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: "Context"
      description: "Links, related issues, code pointers (path:line), prior art."
      placeholder: "- `src/invoices/table.ts:42` renders the table that is copied today."
    validations:
      required: false
  - type: textarea
    id: attachments
    attributes:
      label: "Attachments"
      description: "One bullet per file: the file name, what it shows, and how it was attached (uploaded, inline, pending upload)."
      placeholder: "- `checkout-error.png`: the total after applying `SPRING10` (uploaded)"
    validations:
      required: false
