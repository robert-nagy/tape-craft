# Generated by `sentinel setup --learn-verify` (ADR-0008). Checks that lessons added in a
# pull request follow sentinel's own-PR rule. It runs from the base branch and reads the
# pull request's files through the API; it never checks out or runs the pull request's code.
name: Sentinel lessons

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: sentinel learn verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Download sentinel v0.6.0 (commit 6f61b350cb64)
        run: curl -fsSL --retry 3 -o "$RUNNER_TEMP/sentinel.mjs" "https://raw.githubusercontent.com/robert-nagy/sentinel/6f61b350cb64de5965eb875326d96baa7b2b23b0/plugins/sentinel/skills/sentinel-sdlc/scripts/sentinel.mjs"
      - name: Verify lesson changes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node "$RUNNER_TEMP/sentinel.mjs" learn verify --pr "$PR" --sha "$HEAD_SHA"
