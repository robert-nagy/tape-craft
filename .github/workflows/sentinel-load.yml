name: Load tests

# Generated by `sentinel setup`. Edit freely: sentinel never rewrites this file.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  load:
    name: load
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: grafana/setup-k6-action@v1
      - run: k6 run load/smoke.js
